version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_password
      POSTGRES_DB: forensics_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Backend and frontend will be run locally via host (uvicorn & vite) for development ease in Phase 1,
  # but can be added here later for full containerization.

volumes:
  postgres_data:
